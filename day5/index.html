<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users Directory</title>
  <script src="users.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Users Directory</h1>
      <p>Load a list of users and filter it by name.</p>
    </header>

    <section aria-labelledby="users-heading">
      <h2 id="users-heading">Users</h2>
      <button id="load-users" type="button">Load users</button>
      <label for="filter-input">Filter by name</label>
      <input id="filter-input" type="search" autocomplete="off">
      <p id="status" role="status" aria-live="polite">Select “Load users” to get started.</p>
      <ul id="users-list"></ul>
    </section>
  </main>
</body>
</html>
